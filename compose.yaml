services:
  app:
    build:
      context: .
      dockerfile: infra/php/Dockerfile
    container_name: nyeri_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: nyeri_youth
      DB_USERNAME: nyeri_user
      DB_PASSWORD: nyeri_password

      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379

    ports:
      - "8001:8001"

    volumes:
      - ./backend:/var/www/html

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: nyeri_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: nyeri_youth
      MYSQL_USER: nyeri_user
      MYSQL_PASSWORD: nyeri_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-proot_password"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: nyeri_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
  redis_data:
