deployment:
  tasks:
    - >-
      /bin/bash -c 'set -eu;
      LARAVEL_DIR="/home/shemidig7/laravel-api";
      FRONTEND_DIR="$LARAVEL_DIR/public";
      /bin/mkdir -p "$LARAVEL_DIR";
      /bin/cp -R backend/. "$LARAVEL_DIR/";
      /bin/cp -R frontend/dist/. "$FRONTEND_DIR/";
      /bin/cp backend/public/.htaccess "$FRONTEND_DIR/.htaccess";
      cd "$LARAVEL_DIR";
      php artisan migrate --force;
      php artisan optimize:clear;
      php artisan config:cache;
      php artisan route:cache;
      php artisan view:cache'
