name: Deploy production

on:
  push:
    branches:
      - Main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  verify:
    name: Verify application
    environment: production
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, intl, pdo_mysql, zip
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run backend tests
        working-directory: backend
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          touch database/database.sqlite
          php artisan test

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          include-hidden-files: true
          if-no-files-found: error

  deploy-backend:
    name: Deploy Laravel API
    needs: verify
    environment: production
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload Laravel application
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          server-dir: ${{ secrets.CPANEL_BACKEND_DIR }}
          local-dir: ./backend/
          exclude: |
            **/.env
            **/.env.*
            **/vendor/**
            **/node_modules/**
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/tests/**
            **/.phpunit.result.cache
            **/public/build/**

      - name: Install dependencies and migrate
        uses: appleboy/ssh-action@v1.2.2
        env:
          BACKEND_DIR: ${{ secrets.CPANEL_BACKEND_DIR }}
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USERNAME }}
          password: ${{ secrets.CPANEL_SSH_PASSWORD }}
          port: ${{ secrets.CPANEL_SSH_PORT || 22 }}
          envs: BACKEND_DIR
          script: |
            set -e
            cd "$BACKEND_DIR"

            if [ ! -f .env ]; then
              echo "Missing server .env in $BACKEND_DIR"
              exit 1
            fi

            composer_bin="$(command -v composer || true)"
            if [ -z "$composer_bin" ]; then
              for candidate in /opt/cpanel/composer/bin/composer /usr/local/bin/composer /usr/bin/composer; do
                if [ -x "$candidate" ]; then
                  composer_bin="$candidate"
                  break
                fi
              done
            fi

            if [ -z "$composer_bin" ]; then
              echo "Composer is not available on the target server"
              exit 1
            fi

            "$composer_bin" install --no-dev --no-interaction --prefer-dist --optimize-autoloader
            php artisan migrate --force
            php artisan db:seed --class=ProgramSeeder --force
            php artisan db:seed --class=ProgramFormFieldSeeder --force
            php artisan storage:link || true
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

  deploy-frontend:
    name: Deploy frontend
    needs: [verify, deploy-backend]
    environment: production
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Upload frontend
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          server-dir: ${{ secrets.CPANEL_FRONTEND_DIR }}
          local-dir: ./frontend-dist/

  smoke-test:
    name: Smoke test production
    needs: deploy-frontend
    environment: production
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Check Laravel health endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: curl --fail --silent --show-error --max-time 30 "$APP_URL/up"

      - name: Check public program catalog
        env:
          API_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: curl --fail --silent --show-error --max-time 30 "$API_URL/api/v1/programs"

      - name: Check admin portal route
        env:
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        run: curl --fail --silent --show-error --max-time 30 "$FRONTEND_URL/admin"

      - name: Check admin API authorization
        env:
          API_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          status=$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' "$API_URL/api/v1/admin/registrations")
          test "$status" = "401"
