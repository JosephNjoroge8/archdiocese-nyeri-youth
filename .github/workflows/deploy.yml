name: CI/CD

on:
  push:
    branches:
      - Main
  pull_request:
    branches:
      - Main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, pdo_mysql, sqlite3, xml, intl
          tools: composer:v2
          coverage: none

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run backend tests
        working-directory: backend
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: php artisan test

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://api.example.invalid
        run: npm run build

  deploy:
    name: Build production branch and deploy
    needs: test
    if: github.ref == 'refs/heads/Main' && vars.CPANEL_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: Main
          path: src

      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: production
          path: prod
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, pdo_mysql, sqlite3, xml, intl
          tools: composer:v2
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Build backend and frontend
        working-directory: src
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          composer install \
            --working-dir=backend \
            --no-dev \
            --optimize-autoloader \
            --no-interaction \
            --prefer-dist \
            --no-progress
          npm ci --prefix frontend
          npm run build --prefix frontend

      - name: Sync build into production branch
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='.env' \
            src/ prod/

          printf '.env\n**/.env\n**/storage/logs/*.log\n' > prod/.gitignore
          cd prod
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f backend/vendor frontend/dist
          if ! git diff --cached --quiet; then
            git commit -m "Deploy ${SOURCE_SHA:0:7}"
            git push origin production
          fi

      - name: Trigger cPanel update and deployment
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_REPO_PATH: ${{ secrets.CPANEL_REPO_PATH }}
        run: |
          set -euo pipefail

          : "${CPANEL_HOST:?Configure CPANEL_HOST in the production environment}"
          : "${CPANEL_USER:?Configure CPANEL_USER in the production environment}"
          : "${CPANEL_API_TOKEN:?Configure CPANEL_API_TOKEN in the production environment}"
          : "${CPANEL_REPO_PATH:?Configure CPANEL_REPO_PATH in the production environment}"

          auth="Authorization: cpanel ${CPANEL_USER}:${CPANEL_API_TOKEN}"
          base="https://${CPANEL_HOST}:2083/execute"

          echo "Updating the production repository..."
          update_response=$(curl --fail --silent --show-error \
            --get \
            --header "$auth" \
            --data-urlencode "repository_root=${CPANEL_REPO_PATH}" \
            --data-urlencode "branch=production" \
            "${base}/VersionControl/update")
          echo "$update_response" | jq --exit-status '.status == 1' > /dev/null

          echo "Running the cPanel deployment tasks..."
          deploy_response=$(curl --fail --silent --show-error \
            --get \
            --header "$auth" \
            --data-urlencode "repository_root=${CPANEL_REPO_PATH}" \
            "${base}/VersionControlDeployment/create")
          echo "$deploy_response" | jq --exit-status '.status == 1' > /dev/null
